services:
  # MySQL Database Service
  database:
    image: mysql:8.0
    container_name: uxco_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: uxco_db
      MYSQL_USER: uxco_user
      MYSQL_PASSWORD: uxco_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - uxco_network

  # Node.js Express Backend API Service (with Hot-Reload Watch Mode)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uxco_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: uxco_user
      DB_PASSWORD: uxco_password
      DB_NAME: uxco_db
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - uxco_network

  # React Frontend (Vite Dev Server with HMR Hot Module Reloading)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uxco_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - uxco_network

volumes:
  mysql_data:
    driver: local

networks:
  uxco_network:
    driver: bridge
